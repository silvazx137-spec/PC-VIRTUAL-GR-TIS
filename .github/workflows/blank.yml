name: Virtual PC
on:
  workflow_dispatch:
jobs:
  pc:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update system
        run: sudo apt update
      - name: Install desktop
        run: |
          sudo apt install -y xfce4 xfce4-goodies xrdp
          sudo systemctl enable --now xrdp
      - name: Install GPU tools
        run: |
          sudo apt install -y pciutils
          if command -v nvidia-smi >/dev/null; then nvidia-smi; else echo "NVIDIA GPU nao encontrada"; fi
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sudo sh
          sudo systemctl enable --now tailscaled
      - name: Connect Tailscale
        env:
          TS_AUTHKEY: ${{ tskey-auth-kBR5s33Qj721CNTRL-SvxuCeAzMK5wYFqgA2sZK54RgtH6HZcN.TS_AUTHKEY }}
        run: |
          sudo tailscale up --auth-key="$TS_AUTHKEY" --ssh
          tailscale ip -4
      - name: Prepare gamer
        env:
          RDP_PASSWORD: ${{ 12345678.RDP_PASSWORD }}
        run: |
          sudo useradd -m -s /bin/bash gamer || true
          echo "gamer:$RDP_PASSWORD" | sudo chpasswd
          echo "startxfce4" | sudo tee /home/gamer/.xsession
          sudo chown gamer:gamer /home/gamer/.xsession
      - name: Start RDP
        run: |
          sudo systemctl restart xrdp
          echo "=== GPU ==="
          lspci | grep -Ei "vga|3d|display" || true
      - name: Keep online
        run: |
          echo "PC virtual pronto"
          echo "Use o IP Tailscale no RDP"
          sleep 21420
